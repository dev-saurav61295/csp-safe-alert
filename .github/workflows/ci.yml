name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run test suite
        run: npm test

      - name: Verify packed npm artifact
        env:
          CSPA_PACK_OUTPUT_DIR: ${{ runner.temp }}/cspa-pack
        run: npm run test:package

      - name: Upload verified npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: csp-safe-alert-npm-tarball
          path: ${{ runner.temp }}/cspa-pack/*.tgz
          if-no-files-found: error
